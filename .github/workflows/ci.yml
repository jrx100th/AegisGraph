name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve Go dependencies
        run: go mod tidy
      - name: Format Go
        run: gofmt -w $(find . -name '*.go' -type f)
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test ./...
      - name: Go race tests
        run: go test -race ./...
      - name: Go microbenchmarks
        run: go test -run '^      - name: Frontend install
        working-directory: frontend
        run: npm install
      - name: Frontend build
        working-directory: frontend
        run: npm run build
 -bench '^Benchmark' -benchmem ./...
      - name: Frontend install
        working-directory: frontend
        run: npm install
      - name: Frontend build
        working-directory: frontend
        run: npm run build
