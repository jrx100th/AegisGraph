name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve Go dependencies
        run: go mod tidy
      - name: Format Go
        run: gofmt -w $(find . -name '*.go' -type f)
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test ./...
      - name: Go race tests
        run: go test -race ./...
      - name: Go microbenchmarks
        run: go test -run "^$" -bench "^Benchmark" -benchmem ./...
      - name: Frontend install
        working-directory: frontend
        run: npm install
      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Build backend
        run: go build -trimpath -o /tmp/aegisgraph ./cmd/aegisgraph
      - name: Application startup smoke
        run: |
          mkdir -p /tmp/aegisgraph-static
          printf '<!doctype html><title>AegisGraph</title>' > /tmp/aegisgraph-static/index.html
          /tmp/aegisgraph -addr 127.0.0.1:18080 -static /tmp/aegisgraph-static -db /tmp/aegisgraph.db >/tmp/aegisgraph.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health >/tmp/aegisgraph-health.json; then break; fi
            sleep 1
          done
          test -s /tmp/aegisgraph-health.json
          curl -fsS -X POST 'http://127.0.0.1:18080/api/demo/load?environment=attack-path' >/tmp/aegisgraph-demo.json
          curl -fsS http://127.0.0.1:18080/api/findings >/tmp/aegisgraph-findings.json
          curl -fsS http://127.0.0.1:18080/api/attack-paths >/tmp/aegisgraph-paths.json
      - name: Docker build
        run: docker build -t aegisgraph:ci .
